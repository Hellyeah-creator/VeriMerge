[project]
name = "verimerge-backend"
version = "0.1.0"
description = "VeriMerge - AI-Powered Evidence-First Record Reconciliation Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "rapidfuzz>=3.9.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"